<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行程大侦探 · 先破案,再出发</title>
<meta name="description" content="聊天式旅行规划助手:像侦探一样排查你的旅行需求,找出预算、时间、距离、偏好、季节五类矛盾,给出三级裁决与取舍方案。">
<meta name="theme-color" content="#f4f0e6">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='10'%20fill='%23a63c30'/%3E%3Ctext%20x='32'%20y='46'%20font-size='38'%20text-anchor='middle'%20fill='%23fdfaf3'%20font-family='KaiTi,STKaiti,serif'%3E%E4%BE%A6%3C/text%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:title" content="行程大侦探 · 先破案,再出发">
<meta property="og:description" content="不做顺从的行程生成器——我负责找出你没意识到的矛盾。侦探式追问、三级裁决、方案取舍、预算账本,一站式旅行规划。">
<meta property="og:url" content="https://wood-feather.github.io/trip-detective-demo/">
<meta property="og:image" content="https://wood-feather.github.io/trip-detective-demo/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="行程大侦探 · 先破案,再出发">
<meta name="twitter:description" content="聊天式旅行规划助手:排查旅行需求里的矛盾,给出裁决与取舍方案。">
<meta name="twitter:image" content="https://wood-feather.github.io/trip-detective-demo/share.png">
<link rel="stylesheet" href="css/ink.css">
</head>
<body>

<div id="app">

  <header class="masthead">
    <a class="mark" href="./" aria-label="回到开场">侦</a>
    <div class="masthead-title">
      <h1>行程大侦探</h1>
      <p>不做顺从的行程生成器——我负责找出你没意识到的矛盾</p>
    </div>
    <nav class="actions" aria-label="操作">
      <button id="newCase" class="line-btn" type="button">新建案件</button>
      <i aria-hidden="true"></i>
      <button id="retry" class="line-btn quiet" type="button" disabled>重新侦查</button>
      <i aria-hidden="true"></i>
      <button id="toggleConfig" class="line-btn quiet" type="button">收起配置</button>
    </nav>
  </header>

  <div id="verdictBar">
    <span id="badge" class="badge clear"></span>
    <span class="vtxt" id="verdictText"></span>
    <span id="confBadge" class="conf-badge" hidden></span>
  </div>

  <section id="cluePanel" class="clue-panel" hidden aria-label="线索清单">
    <div class="clue-head">
      <span class="eyebrow">线索清单</span>
      <span id="clueMeterText" class="clue-meter-text"></span>
    </div>
    <div class="meter"><span id="clueMeterFill" class="meter-fill"></span></div>
    <div id="clueChips" class="clue-chips"></div>
  </section>

  <section id="configPanel" class="keybar" aria-label="接口配置">
    <div class="keygrid">
      <div>
        <label class="field-label" for="apiUrl">API 地址</label>
        <input id="apiUrl" value="https://api.deepseek.com/chat/completions" placeholder="https://.../chat/completions">
      </div>
      <div>
        <label class="field-label" for="model">模型名</label>
        <input id="model" value="deepseek-chat" placeholder="deepseek-chat">
      </div>
      <div>
        <label class="field-label" for="key">API Key</label>
        <input id="key" type="password" placeholder="sk-...">
      </div>
    </div>
    <p class="note">本页面为纯前端 Demo,请求由浏览器直接发往你填写的接口。Key 只存在你这台设备的浏览器里(localStorage),不会被本站收集或上传。</p>
  </section>

  <div class="chat-wrap">
    <div class="chat-bg" aria-hidden="true">
      <span class="mist m1"></span>
      <span class="mist m2"></span>
      <div class="ink-center">
        <span class="ink-hills"></span>
        <span class="poem">行到水穷处<br>坐看云起时<i></i></span>
      </div>
    </div>
    <main id="chat"></main>
  </div>

  <div id="loading">侦探正在排查矛盾</div>

  <footer id="bar">
    <input id="input" placeholder="例如:我下周末带爸妈去杭州,2天1晚,预算1500,爸爸爱喝茶,妈妈爱拍照">
    <button id="send" class="seal-btn" type="button">发送</button>
  </footer>

</div>

<script src="js/prompt.js"></script>
<script src="js/app.js"></script>
</body>
</html>
